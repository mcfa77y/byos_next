services:
  byos-next:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: byos_next_app
    ports:
      - "4000:3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:4000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - byos_network
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: byos_cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - byos_network
    depends_on:
      - byos-next

networks:
  byos_network:
    name: byos_network
    driver: bridge

# SonarQube Project Configuration
sonar.projectKey=byos_next
sonar.projectName=byos_next
sonar.projectVersion=0.2.15

# Source & Test paths
sonar.sources=app,components,hooks,lib,utils,scripts,proxy.ts,instrumentation.ts
sonar.tests=app,lib,utils
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/coverage/**,**/public/**,**/bruno/**,**/migrations/**
sonar.coverage.exclusions=scripts/**,**/*.d.ts,app/(app)/**,components/**

# Encoding & Language options
sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPath=tsconfig.json
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Server configuration (default local instance; can be overridden via SONAR_HOST_URL & SONAR_TOKEN env variables)
sonar.host.url=http://localhost:9000
sonar.token=squ_fa1e8847a79c94c5fe5679cc04813c6d5dcf68f1
